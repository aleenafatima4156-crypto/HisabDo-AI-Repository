<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HisabDo AI Help & Support</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 20px; background:#f5f6f8; }
    .card { background:white; padding:24px; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    textarea { width:100%; min-height:110px; padding:12px; box-sizing:border-box; border:1px solid #ccc; border-radius:8px; }
    button { margin-top:12px; padding:10px 18px; border:0; border-radius:8px; cursor:pointer; }
    #answer { margin-top:20px; padding:16px; background:#f0f3f7; border-radius:10px; white-space:pre-wrap; }
    .related button { margin:6px 6px 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>HisabDo AI Help & Support</h1>
    <p>Ask a question about using HisabDo.</p>
    <textarea id="query" maxlength="500" placeholder="Example: How can I add an expense?"></textarea>
    <button onclick="ask()">Ask AI</button>
    <div id="answer"></div>
    <div id="related" class="related"></div>
  </div>

<script>
async function ask(question) {
  const input = document.getElementById("query");
  const q = (question ?? input.value).trim();

  if (!q) {
    document.getElementById("answer").textContent = "Please enter a question.";
    return;
  }

  document.getElementById("answer").textContent = "Thinking...";
  document.getElementById("related").innerHTML = "";

  try {
    const response = await fetch("/ai/help/faq", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: q})
    });

    const result = await response.json();
    if (!response.ok) {
      document.getElementById("answer").textContent = result.message || "Request failed.";
      return;
    }

    const data = result.data;
    document.getElementById("answer").textContent =
      data.answer + "\n\nConfidence: " + (data.confidence_level || "low");

    const related = document.getElementById("related");
    if (data.related_questions?.length) {
      related.innerHTML = "<strong>Related questions:</strong><br>";
      data.related_questions.forEach(q => {
        const btn = document.createElement("button");
        btn.textContent = q;
        btn.onclick = () => {
          input.value = q;
          ask(q);
        };
        related.appendChild(btn);
      });
    }
  } catch (error) {
    document.getElementById("answer").textContent =
      "Unable to connect to the support API.";
  }
}
</script>
</body>
</html>
